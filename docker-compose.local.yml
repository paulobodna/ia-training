services:
  postgres:
    image: postgres:18
    container_name: codex-postgres-dev
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    
    ports:
      - "5432:5432"

    volumes:
      - codex_postgres_dev_data:/var/lib/postgresql
  
volumes:
  codex_postgres_dev_data: